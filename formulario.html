<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
    <style>
        body {
            background-image: url('/img/formulario-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            color: antiquewhite;
        }

        button {
            border-radius: 1cqmin;
        }

        input {
            border-radius: 1cqmin;
        }
    </style>
</head>

<body>

    <h1>Reserva tu viaje interplanetario</h1>
    <button><a href="index.html">Ir a inicio</a></button>
    <form action="index.html">

        <label for="">Digite su nombre</label>
        <input type="text">

        <br><br>

        <label for="">Digite su identificacion</label>
        <input type="number">

        <br><br>

        <label for="">Digite su correo</label>
        <input type="email">

        <br><br>

        <label for="">Seleccione su destino</label>

        <select name="destino" id="destino">

            <option value="mercurio">Mercurio</option>
            <option value="venus">Venus</option>
            <option value="marte">Marte</option>
            <option value="tierra">Tierra</option>
            <option value="jupiter">Júpiter</option>
            <option value="saturno">Saturno</option>
            <option value="urano">Urano</option>
            <option value="neptuno">Neptuno</option>

        </select>

        <br><br>

        <label for="">Seleccione el numero de viajeros</label>

        <select name="viajeros" id="viajeros">

            <option value="1">1 viajero</option>
            <option value="2">2 viajeros</option>
            <option value="3">3 viajeros</option>
            <option value="4">4 viajeros</option>
            <option value="5">5 viajeros</option>

        </select>

        <br><br>

        <label for="">Seleccione la fecha del viaje</label>
        <input type="date">

        <br><br>

        <input type="submit" value="Reservar viaje">

    </form>


    <p id="mensaje"></p>

    <script src="js/script.js"></script>

</body>

</html>
