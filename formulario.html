<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas</title>
     <style>
        body {
            background-image: url('img/formulario-background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0; 
            padding: 20px;
            color: #ffffff;
        }
        input, select {
            padding: 6px;
            border-radius: 4px;
            border: none;
            margin: 4px 0;
        }
        input[type="submit"] {
            background-color: #3b82f6;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #2563eb;
        }
        a {
            color: #90caf9;
        }
        #mensaje {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(34, 197, 94, 0.8);
            color: white;
            border-radius: 8px;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Reserva tu viaje interplanetario</h1>
    <a href="index.html">Ir a inicio</a>

    <form id="formularioReserva">
        <label>Digite su nombre</label>
        <input type="text" id="nombre">
        <br><br>
        <label>Digite su identificación</label>
        <input type="number" id="identificacion">
        <br><br>
        <label>Digite su correo</label>
        <input type="email" id="correo">
        <br><br>
        <label>Seleccione su destino</label>
        <select name="destino" id="destino">
            <option value="mercurio">Mercurio</option>
            <option value="venus">Venus</option>
            <option value="marte">Marte</option>
            <option value="tierra">Tierra</option>
            <option value="jupiter">Júpiter</option>
            <option value="saturno">Saturno</option>
            <option value="urano">Urano</option>
            <option value="neptuno">Neptuno</option>
        </select>
        <br><br>
        <label>Seleccione el número de viajeros</label>
        <select name="viajeros" id="viajeros">
            <option value="1">1 viajero</option>
            <option value="2">2 viajeros</option>
            <option value="3">3 viajeros</option>
            <option value="4">4 viajeros</option>
            <option value="5">5 viajeros</option>
        </select>
        <br><br>
        <label>Seleccione la fecha del viaje</label>
        <input type="date" id="fecha">
        <br><br>
        <input type="submit" value="Reservar viaje">
    </form>
     
    <p id="mensaje"></p>

    <script>
        const formulario = document.getElementById('formularioReserva');
        const mensaje = document.getElementById('mensaje');

        formulario.addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value.trim();
            const identificacion = document.getElementById('identificacion').value.trim();
            const correo = document.getElementById('correo').value.trim();
            const fecha = document.getElementById('fecha').value;

            if (nombre === "") {
                alert(" Por favor escribe tu nombre.");
                return;
            }
            if (identificacion === "") {
                alert("Por favor escribe tu identificación.");
                return;
            }
            if (correo === "" || !correo.includes('@')) {
                alert("Por favor escribe un correo válido con @.");
                return;
            }
            if (fecha === "") {
                alert("Por favor selecciona la fecha del viaje.");
                return;
            }

            mensaje.style.display = "block";
            mensaje.innerHTML = "¡Reserva exitosa! <br>Tu solicitud ha sido recibida.";
            formulario.reset();
        });
    </script>
</body>
</html>
